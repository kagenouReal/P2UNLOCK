name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc-x64:
    name: Windows MSVC x64 (P2UNLOCK.exe)
    # Preset targets "Visual Studio 17 2022"; windows-latest now ships VS 2026.
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure (CMake preset)
        run: cmake --preset windows-msvc-x64

      - name: Build Release
        run: cmake --build --preset windows-msvc-x64 --config Release --parallel

      - name: Smoke test (help output only, no hardware access)
        shell: pwsh
        run: .\build\windows-msvc-x64\apps\cli\Release\P2UNLOCK.exe help

      - name: Stage release bundle
        shell: pwsh
        run: |
          $stage = "release/windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/drivers" | Out-Null
          Copy-Item "build/windows-msvc-x64/apps/cli/Release/P2UNLOCK.exe" "$stage/P2UNLOCK.exe"
          Copy-Item "build/windows-msvc-x64/apps/cli/Release/drivers/SvIoCtrlx64.sys" "$stage/drivers/SvIoCtrlx64.sys"
          Compress-Archive -Path "$stage/*" -DestinationPath "P2UNLOCK-windows-x64.zip" -Force

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: P2UNLOCK-windows-x64
          path: |
            release/windows-x64/P2UNLOCK.exe
            release/windows-x64/drivers/SvIoCtrlx64.sys
            P2UNLOCK-windows-x64.zip
          if-no-files-found: error

  linux-core:
    name: Linux portable core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure (CMake preset)
        run: cmake --preset linux-core

      - name: Build
        run: cmake --build --preset linux-core --parallel
